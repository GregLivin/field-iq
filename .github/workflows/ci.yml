name: Field IQ CI

on:
  pull_request:
  push:
    branches: [main, feature/market-analyzer]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ml.txt -r api/requirements.txt
      - run: python -m pytest -q
      - run: python -m py_compile api/main.py pipeline/features.py pipeline/player_features.py pipeline/train_models.py pipeline/export_player_stats.py
      - run: |
          test -f data/processed/player_stats.json
          python -c "import json; p=json.load(open('data/processed/player_stats.json')); assert p.get('seasons',{}).get('2025',{}).get('teams'); print('checked committed player stats artifact')"
