name: Field IQ CI

on:
  pull_request:
  push:
    branches: [main, feature/market-analyzer]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile api/main.py pipeline/features.py pipeline/train_models.py
