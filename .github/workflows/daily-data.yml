name: Daily FieldIQ data and predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: fieldiq-daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ML and API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt -r api/requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect data, train models, and predict
        env:
          FIELDIQ_CONTACT_EMAIL: ${{ secrets.FIELDIQ_CONTACT_EMAIL }}
        run: |
          python -m pipeline.run_daily
          python -m pipeline.export_2025_player_reference
          python -m pipeline.export_player_stats

      - name: Upload datasets and model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fieldiq-data-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/
            data/manual/2025_player_stats_reference.csv
            data/manual/2025_player_stats_reference_audit.json
            models/
          retention-days: 30

      - name: Publish small app artifacts
        run: |
          git config user.name "fieldiq-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            data/processed/predictions.json \
            data/processed/model_metrics.json \
            data/processed/schedule.json \
            data/processed/matchup_history.json \
            data/processed/matchups.json \
            data/processed/player_stats.json \
            data/processed/*_player_source_audit.json \
            data/manual/2025_player_stats_reference.csv \
            data/manual/2025_player_stats_reference_audit.json \
            data/raw/manifest.json \
            data/raw/weather_status.json

          if git diff --cached --quiet; then
            echo "No data or prediction changes to commit"
          else
            git commit -m "Update daily NFL data and predictions"
            git push
          fi
